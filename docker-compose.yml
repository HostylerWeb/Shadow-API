services:
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: shadowapi
      POSTGRES_PASSWORD: shadowapi
      POSTGRES_DB: shadowapi
    ports:
      - "5433:5432"
    volumes:
      # Postgres 18+ images expect the mount at /var/lib/postgresql (not .../data).
      - shadowapi_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shadowapi -d shadowapi"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - shadowapi_minio:/data

volumes:
  shadowapi_pg:
  shadowapi_minio:
